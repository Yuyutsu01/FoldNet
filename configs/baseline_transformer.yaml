# Baseline Transformer Experiment — FoldNet
# Run: python run.py --config configs/baseline_transformer.yaml

experiment:
  name: baseline_transformer
  description: "Transformer encoder baseline — 4 layers, 8 heads, hidden_dim=512"
  encoder_type: transformer

model:
  feature_dim: 1280          # ESM2 embedding size — do NOT change
  hidden_dim: 512
  num_classes: 3             # helix / sheet / coil
  lambda_contact: 0.5        # weight for contact map loss
  freeze_encoder: false

training:
  lr: 5e-4                   # Slightly lower LR for Transformer stability
  epochs: 100
  batch_size: 2              # Transformers use more memory
  accumulate_grad_batches: 8 # effective batch size = 16
  val_split: 0.1
  num_workers: 0             # 0 = safe on Windows

data:
  max_len: 512
  esm_dir: foldnet/data/processed/esm2_embeddings
  contact_dir: data/processed/pdb_contact_maps

callbacks:
  early_stopping:
    monitor: val_loss
    patience: 10
    mode: min
  checkpoint:
    save_top_k: 3
    monitor: val_loss
    mode: min

paths:
  checkpoint_dir: results/checkpoints
  logs_dir: results/logs
