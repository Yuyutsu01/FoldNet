# BiLSTM Encoder Experiment — FoldNet
# Run: python run.py --config configs/baseline_bilstm.yaml --fold 0

experiment:
  name: baseline_bilstm
  description: "BiLSTM encoder baseline — 2 layers, hidden_dim=512"
  encoder_type: bilstm

model:
  feature_dim: 1280          # Adjusted automatically to 25 by run.py if using basic features
  hidden_dim: 512
  num_classes: 3             # helix / sheet / coil
  lambda_contact: 0.5        # weight for contact map loss
  freeze_encoder: false

training:
  lr: 1e-3
  epochs: 100
  batch_size: 4              # safe for 6GB GPU
  accumulate_grad_batches: 4 # effective batch size = 16
  val_split: 0.1
  num_workers: 0             # 0 = safe on Windows

data:
  max_len: 512

callbacks:
  early_stopping:
    monitor: val_loss
    patience: 10
    mode: min
  checkpoint:
    save_top_k: 3
    monitor: val_loss
    mode: min

paths:
  checkpoint_dir: results/checkpoints
  logs_dir: results/logs
