<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldNet 3D Protein Viewer</title>
    <!-- 3Dmol.js from CDN -->
    <script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background-color: #121212; color: #fff; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #header { padding: 15px 20px; background-color: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        h1 { margin: 0; font-size: 1.5rem; background: linear-gradient(90deg, #FF5555, #FFFF55, #55FF55); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #main-container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 300px; padding: 20px; background-color: #1e1e1e; border-right: 1px solid #333; overflow-y: auto; }
        #viewer-container { flex: 1; position: relative; }
        #gldiv { width: 100%; height: 100%; position: absolute; }
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; }
        input[type="file"] { display: block; width: 100%; padding: 8px; background: #333; border: 1px solid #444; border-radius: 4px; color: #fff; }
        button { background-color: #4a90e2; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        button:hover { background-color: #357abd; }
        .ss-legend { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.9em; }
        .ss-item { display: flex; align-items: center; }
        .color-box { width: 15px; height: 15px; border-radius: 3px; margin-right: 5px; }
        .helix { background-color: #FF5555; }
        .sheet { background-color: #55FF55; }
        .coil { background-color: #AAAAAA; }
        input[type="range"] { width: 100%; }
        #tooltip { position: absolute; padding: 8px; background: rgba(0,0,0,0.8); border: 1px solid #555; border-radius: 4px; color: #fff; display: none; pointer-events: none; z-index: 100; font-size: 14px; }
    </style>
</head>
<body>

<div id="header">
    <h1>FoldNet 3D Viewer</h1>
    <div>High-Tier Dynamic Protein Visualisation</div>
</div>

<div id="main-container">
    <div id="sidebar">
        <div class="control-group">
            <label for="json-upload">Load Prediction JSON</label>
            <input type="file" id="json-upload" accept=".json">
        </div>

        <div class="control-group">
            <label>Secondary Structure Prediction</label>
            <div class="ss-legend">
                <div class="ss-item"><div class="color-box helix"></div>Helix</div>
                <div class="ss-item"><div class="color-box sheet"></div>Sheet</div>
                <div class="ss-item"><div class="color-box coil"></div>Coil</div>
            </div>
        </div>

        <div class="control-group">
            <label><input type="checkbox" id="toggle-contacts" checked> Show Predicted Contacts</label>
        </div>

        <div class="control-group">
            <label for="surface-slider">Surface Transparency</label>
            <input type="range" id="surface-slider" min="0" max="1" step="0.1" value="0.0">
        </div>

        <div class="control-group">
            <label for="contact-threshold">Contact Probability Threshold</label>
            <input type="range" id="contact-threshold" min="0" max="1" step="0.05" value="0.7">
            <span id="threshold-val">0.7</span>
        </div>

        <div class="control-group">
            <button id="btn-screenshot">Capture Screenshot</button>
        </div>
    </div>

    <div id="viewer-container">
        <div id="gldiv"></div>
        <div id="tooltip"></div>
    </div>
</div>

<script>
    let viewer;
    let currentData = null;
    let surfaceObj = null;

    // Colors mapping 0=Helix, 1=Sheet, 2=Coil
    const ssColors = { 0: 'red', 1: 'green', 2: 'grey' }; // 3Dmol uses standard colors or hex, #FF5555 doesn't work directly with color schemes, so we'll apply atom by atom
    const ssColorsHex = { 0: '#FF5555', 1: '#55FF55', 2: '#AAAAAA' };
    const ssNames = { 0: 'Helix', 1: 'Sheet', 2: 'Coil' };

    $(document).ready(function() {
        let element = $('#gldiv');
        let config = { backgroundColor: '#121212' };
        viewer = $3Dmol.createViewer(element, config);

        $('#json-upload').on('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    currentData = JSON.parse(e.target.result);
                    loadProtein(currentData);
                } catch(err) {
                    alert("Error parsing JSON: " + err);
                }
            };
            reader.readAsText(file);
        });

        $('#toggle-contacts').on('change', updateContacts);
        $('#contact-threshold').on('input', function() {
            $('#threshold-val').text($(this).val());
            updateContacts();
        });

        $('#surface-slider').on('input', function() {
            let val = parseFloat($(this).val());
            if (val > 0) {
                if (!surfaceObj) {
                    surfaceObj = viewer.addSurface($3Dmol.SurfaceType.VDW, {opacity: val, color: 'white'});
                } else {
                    viewer.setSurfaceMaterialStyle(surfaceObj.surfid, {opacity: val});
                }
            } else if (surfaceObj) {
                viewer.removeSurface(surfaceObj);
                surfaceObj = null;
            }
            viewer.render();
        });

        $('#btn-screenshot').on('click', function() {
            let imgData = viewer.pngURI();
            let link = document.createElement('a');
            link.download = 'foldnet_3d_screenshot.png';
            link.href = imgData;
            link.click();
        });
    });

    function loadProtein(data) {
        viewer.clear();
        surfaceObj = null;
        
        if (data.pdb_data) {
            viewer.addModel(data.pdb_data, "pdb");
        }
        
        let m = viewer.getModel();
        let atoms = m.selectedAtoms({});
        
        // Map residues to indices. PDB residue numbers might not start at 1 or be continuous
        // We'll extract a unique list of residues to match our ss_labels
        let residues = [];
        let lastResId = null;
        for (let i = 0; i < atoms.length; i++) {
            if (atoms[i].resi !== lastResId) {
                residues.push(atoms[i].resi);
                lastResId = atoms[i].resi;
            }
        }

        // Color based on SS predictions
        if (data.ss_labels && data.ss_labels.length > 0) {
            for (let i = 0; i < residues.length && i < data.ss_labels.length; i++) {
                let resi = residues[i];
                let ssClass = data.ss_labels[i];
                let hexColor = ssColorsHex[ssClass] || '#FFFFFF';
                viewer.setStyle({resi: resi}, {cartoon: {color: hexColor}});
            }
        } else {
            viewer.setStyle({}, {cartoon: {color: 'spectrum'}}); // fallback
        }

        viewer.zoomTo();
        updateContacts();

        // Setup Hover and Click interactivity
        viewer.setHoverable({}, true, 
            function(atom, viewer, event, container) {
                if(!atom.label) {
                    let resIdx = residues.indexOf(atom.resi);
                    let ssClass = resIdx >= 0 && data.ss_labels ? data.ss_labels[resIdx] : -1;
                    let ssName = ssClass >= 0 ? ssNames[ssClass] : 'Unknown';
                    
                    let tooltip = $('#tooltip');
                    tooltip.html(`Residue: ${atom.resn} ${atom.resi}<br>Pred SS: ${ssName}`);
                    tooltip.css({
                        'display': 'block',
                        'left': event.clientX + 15 + 'px',
                        'top': event.clientY + 15 + 'px'
                    });
                }
            },
            function(atom, viewer) {
                $('#tooltip').hide();
            }
        );

        viewer.setClickable({}, true, function(atom, viewer, event, container) {
            viewer.zoomTo({resi: atom.resi});
            // Highlighting contacts for this residue could be implemented here
        });

        viewer.render();
    }

    function updateContacts() {
        if (!currentData || !currentData.contacts) return;
        
        viewer.removeAllShapes();
        
        if ($('#toggle-contacts').is(':checked')) {
            let m = viewer.getModel();
            if (!m) return;
            let atoms = m.selectedAtoms({atom: 'CA'}); // Only connect C-alphas
            let threshold = parseFloat($('#contact-threshold').val());

            // Create mapping from 0-indexed sequence to PDB residue numbers
            let seqToResi = [];
            let allAtoms = m.selectedAtoms({});
            let lastResId = null;
            for (let i = 0; i < allAtoms.length; i++) {
                if (allAtoms[i].resi !== lastResId) {
                    seqToResi.push(allAtoms[i].resi);
                    lastResId = allAtoms[i].resi;
                }
            }

            for (let i = 0; i < currentData.contacts.length; i++) {
                let contact = currentData.contacts[i];
                let res_i_idx = contact[0];
                let res_j_idx = contact[1];
                let prob = contact[2];

                if (prob >= threshold) {
                    let res_i = seqToResi[res_i_idx];
                    let res_j = seqToResi[res_j_idx];
                    
                    if (res_i && res_j) {
                        let atom1 = m.selectedAtoms({resi: res_i, atom: 'CA'})[0];
                        let atom2 = m.selectedAtoms({resi: res_j, atom: 'CA'})[0];
                        
                        if (atom1 && atom2) {
                            // opacity based on probability, alpha 0.2 to 0.8
                            let alpha = 0.2 + (prob - threshold)/(1 - threshold) * 0.6;
                            // Semi-transparent blue lines
                            viewer.addLine({
                                start: {x: atom1.x, y: atom1.y, z: atom1.z},
                                end: {x: atom2.x, y: atom2.y, z: atom2.z},
                                color: 'cyan',
                                opacity: alpha,
                                linewidth: 2
                            });
                        }
                    }
                }
            }
        }
        viewer.render();
    }
</script>
</body>
</html>
